  <style type="text/css">

<body class="off">
  <div id="screen">
    <div id="topText" class="topText hidden">
      NOW IT'S
    </div>

    <div id="dayPeriod" class="dayPeriod hidden">
      SATURDAY AFTERNOON
    </div>

    <div id="timeLine" class="timeLine hidden">
      03:42<span class="ampm">PM</span>
    </div>

    <div id="dateLine" class="dateLine hidden">
      15 AUGUST 2026
    </div>

    <div id="offMessage" class="offMessage">
      Tap a session<br>
      to start clock
    </div>
  </div>

  <div id="status" class="status">
    Manual clock mode
  </div>

  <div id="panel" class="panel">
    <button onclick="startMinutes(60)">School 1h</button><button onclick="startUntil('22:00')">Till 10 PM</button><button onclick="startUntil('01:30')">Till 1:30 AM</button><button onclick="startMinutes(30)">30 min</button><button onclick="stopSession()">Stop</button>
  </div><script type="text/javascript">
    (function () {
        var dayNames = [
            "Sunday",
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday",
            "Saturday",
          ],
          monthNames = [
            "January",
            "February",
            "March",
            "April",
            "May",
            "June",
            "July",
            "August",
            "September",
            "October",
            "November",
            "December",
          ];
        var updateTimer = null,
          endTimer = null,
          sessionEnd = 0,
          wakeLock = null,
          noSleep = null,
          wakeStatus = "not started";
        try {
          if (window.NoSleep) {
            noSleep = new NoSleep();
          }
        } catch (e) {
          noSleep = null;
        }
        function pad2(n) {
          return n < 10 ? "0" + n : "" + n;
        }
        function getPeriod(h) {
          if (h >= 5 && h < 12) return "Morning";
          if (h >= 12 && h < 17) return "Afternoon";
          if (h >= 17 && h < 21) return "Evening";
          if (h >= 21 && h < 24) return "Night";
          return "Before Dawn";
        }
        function show(id, yes) {
          var el = document.getElementById(id);
          if (yes) el.className = el.className.replace(" hidden", "");
          else if (el.className.indexOf("hidden") < 0)
            el.className += " hidden";
        }
        function setClockVisible(yes) {
          show("topText", yes);
          show("dayPeriod", yes);
          show("timeLine", yes);
          show("dateLine", yes);
          show("offMessage", !yes);
          document.body.className = yes ? "" : "off";
        }
        function applyTheme() {
          if (Date.now() >= sessionEnd) {
            document.body.className = "off";
            return;
          }
          document.body.className = "";
        }
        async function enableWake() {
          wakeStatus = "requested";
          try {
            if (navigator.wakeLock && navigator.wakeLock.request) {
              wakeLock = await navigator.wakeLock.request("screen");
              wakeStatus = "native wake lock";
              return;
            }
          } catch (e) {}
          try {
            if (noSleep) {
              noSleep.enable();
              wakeStatus = "NoSleep fallback";
              return;
            }
          } catch (e2) {}
          wakeStatus = "not supported";
        }
        function disableWake() {
          try {
            if (wakeLock && wakeLock.release) wakeLock.release();
          } catch (e) {}
          wakeLock = null;
          try {
            if (noSleep) noSleep.disable();
          } catch (e2) {}
          wakeStatus = "off";
        }
        function remainingText() {
          var ms = sessionEnd - Date.now();
          if (ms <= 0) return "ending";
          var totalMin = Math.ceil(ms / 60000),
            h = Math.floor(totalMin / 60),
            m = totalMin % 60;
          return h > 0 ? h + "h " + m + "m remaining" : m + "m remaining";
        }
        function updateClock() {
          if (Date.now() >= sessionEnd) {
            stopSession();
            return;
          }
          var now = new Date(),
            h = now.getHours(),
            m = now.getMinutes(),
            s = now.getSeconds();
          var h12 = h % 12;
          if (h12 === 0) h12 = 12;
          var ampm = h >= 12 ? "PM" : "AM";
          var day = dayNames[now.getDay()],
            month = monthNames[now.getMonth()],
            date = now.getDate(),
            year = now.getFullYear(),
            period = getPeriod(h);
          document.getElementById("dayPeriod").innerHTML = (
            day +
            " " +
            period
          ).toUpperCase();
          document.getElementById("timeLine").innerHTML =
            pad2(h12) +
            ":" +
            pad2(m) +
            '<span class="ampm">' +
            ampm +
            "<\/span>";
          document.getElementById("dateLine").innerHTML = (
            date +
            " " +
            month +
            " " +
            year
          ).toUpperCase();
          document.getElementById("status").innerHTML =
            "Clock ON ⬢ " + remainingText() + " ⬢ keep-awake: " + wakeStatus;
          applyTheme();
          clearTimeout(updateTimer);
          updateTimer = setTimeout(updateClock, (60 - s) * 1000 + 150);
        }
        window.startMinutes = async function (mins) {
          clearTimeout(endTimer);
          clearTimeout(updateTimer);
          sessionEnd = Date.now() + mins * 60000;
          setClockVisible(true);
          await enableWake();
          updateClock();
          endTimer = setTimeout(stopSession, mins * 60000);
        };
        window.startUntil = async function (hhmm) {
          var now = new Date(),
            p = hhmm.split(":"),
            end = new Date(
              now.getFullYear(),
              now.getMonth(),
              now.getDate(),
              parseInt(p[0], 10),
              parseInt(p[1], 10),
              0,
              0,
            );
          if (end.getTime() <= now.getTime()) end.setDate(end.getDate() + 1);
          var mins = Math.max(
            1,
            Math.ceil((end.getTime() - now.getTime()) / 60000),
          );
          window.startMinutes(mins);
        };
        window.stopSession = function () {
          clearTimeout(endTimer);
          clearTimeout(updateTimer);
          sessionEnd = 0;
          disableWake();
          setClockVisible(false);
          document.getElementById("status").innerHTML =
            "Clock stopped ⬢ iPad can auto-lock now";
        };
        document.addEventListener("visibilitychange", function () {
          if (document.visibilityState === "visible" && Date.now() < sessionEnd)
            updateClock();
        });
      })();
  </script>
